<!DOCTYPE html>
<html>
<head>
  <title>For Rosemary 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #ffd6e8, #ffeef5);
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,.2);
      z-index: 2;
      animation: popIn 1s ease;
    }

    h1 {
      color: #ff4d88;
      margin-bottom: 20px;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.2s ease;
    }

    .yes {
      background: #ff4d88;
      color: white;
    }

    .no {
      background: #ccc;
      position: absolute;
    }

    button:hover {
      transform: scale(1.1);
    }

    @keyframes popIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    .heart {
      position: absolute;
      color: #ff4d88;
      font-size: 20px;
      animation: float 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes float {
      from {
        transform: translateY(100vh) scale(0.5);
      }
      to {
        transform: translateY(-10vh) scale(1.2);
      }
    }

    .celebrate {
      animation: celebrate 1s ease infinite alternate;
    }

    @keyframes celebrate {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <h1>💖 Rosemary, will you be my Valentine? 💖</h1>
    <button class="yes" onclick="yesClick()">Yes 💕</button>
    <button class="no" id="noBtn">No 😢</button>
  </div>

<script>
  const noBtn = document.getElementById("noBtn");
  const card = document.getElementById("card");

  noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  });

  function yesClick() {
    card.innerHTML = "<h1>💘 YAY! I’m so lucky to have you, Rosemary 💘</h1>";
    card.classList.add("celebrate");
    for (let i = 0; i < 40; i++) {
      createHeart();
    }
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 6000);
  }

  // background floating hearts
  setInterval(createHeart, 500);
</script>

</body>
</html>
