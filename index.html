<!DOCTYPE html>
<html>
<head>
  <title>For Rosemary 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #ffd6e8, #ffeef5);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,.2);
      z-index: 2;
      animation: popIn 1s ease;
    }

    h1 {
      color: #ff4d88;
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
      opacity: 0;
      animation: fadeIn 1.5s ease forwards;
    }

    .bear {
      width: 180px;
      margin-top: 20px;
      border-radius: 20px;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.1);
    }

    .yes {
      background: #ff4d88;
      color: white;
    }

    .no {
      background: #ccc;
      position: absolute;
    }

    .forever {
      background: #ff69b4;
      color: white;
      margin-top: 20px;
      animation: popIn 1s ease;
    }

    .heart {
      position: absolute;
      font-size: 22px;
      animation: float 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes float {
      from { transform: translateY(100vh) scale(0.5); }
      to { transform: translateY(-10vh) scale(1.2); }
    }

    @keyframes popIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .celebrate {
      animation: pulse 1s ease infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <h1>💖 Rosemary, will you be my Valentine? 💖</h1>
    <button class="yes" onclick="yesClick()">Yes 💕</button>
    <button class="no" id="noBtn">No 😢</button>
  </div>

<script>
  const noBtn = document.getElementById("noBtn");
  const card = document.getElementById("card");

  noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  });

  function yesClick() {
    card.classList.add("celebrate");
    card.innerHTML = `
      <h1>💘 I love you so much Bubba 💘</h1>
      <p>Forever my Valentine 💖</p>
      <img class="bear" src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Cute bears hugging">
      <p style="margin-top:10px;">— DerpyBum 😘</p>
      <button class="forever">Forever Valentine 💍</button>
    `;

    for (let i = 0; i < 50; i++) {
      burstHeart();
    }
  }

  function burstHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
  }

  setInterval(burstHeart, 500);
</script>

</body>
</html>
