<!DOCTYPE html>
<html>
<head>
  <title>Valentine 💖</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #ffe6f0;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .card {
      background: white;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,.15);
    }
    h1 { color: #ff4d88; }
    button {
      margin: 10px;
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      background: #ff4d88;
      color: white;
    }
    button:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="card">
    <h1>💖 Will you be my Valentine? 💖</h1>
    <button onclick="alert('Yay!! I’m so happy 💕')">Yes 💕</button>
    <button onclick="alert('Best Valentine ever 😘')">Of course 💖</button>
  </div>
</body>
</html>
